# lingo.slippylabs.com -- LibreLingo (slippylabs/lingo), a static SvelteKit build.
# Tracked in the repo; /etc/nginx/sites-available/lingo.slippylabs.conf is a symlink here.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lingo.slippylabs.com;
    include snippets/security-headers.conf;
    include snippets/block-dotfiles.conf;

    ssl_certificate     /etc/letsencrypt/live/slippylabs-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/slippylabs-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/lingo.slippylabs.com;
    index index.html;
    gzip_static on;

    # Content-hashed by Vite: the name changes whenever the bytes do.
    location ^~ /_app/immutable/ {
        include snippets/security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(css|js|json)$ {
        include snippets/security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "max-age=300, stale-while-revalidate=86400" always;
    }

    # Course pictures (/images), lesson audio (/voice, /sound), icons.
    location ~* \.(png|jpe?g|webp|gif|ico|svg|avif|woff2?|ttf|otf|eot|mp3|ogg|wav)$ {
        include snippets/security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "max-age=2592000, stale-while-revalidate=86400" always;
    }

    # Prerendered pages are /course/x.html for the URL /course/x.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;
}
